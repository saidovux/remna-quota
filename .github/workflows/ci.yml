name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: quota_test
          POSTGRES_USER: quota_test
          POSTGRES_PASSWORD: local-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quota_test -d quota_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BACKEND_TEST_DATABASE_URL: postgres://quota_test:local-ci-password@localhost:5432/quota_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Container build
        run: docker build -t remna-quota:test .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
